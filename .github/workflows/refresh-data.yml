name: Refresh data

on:
  schedule:
    - cron: '17 9 1 * *'   # monthly, 09:17 UTC on the 1st
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Perl modules for Divinum Officium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcgi-pm-perl libdate-calc-perl libalgorithm-diff-perl \
            liburi-perl libcgi-session-perl libtimedate-perl

      - name: Regenerate data/liturgy.json
        run: python3 scripts/regenerate.py | tee "$RUNNER_TEMP/summary.txt"

      - name: Show summary
        run: cat "$RUNNER_TEMP/summary.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/liturgy.json
            git commit -m "Refresh liturgy data"
            git push
          fi
