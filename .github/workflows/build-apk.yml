name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'data/**'
      - '*.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk liturgy-widget.apk

      - uses: actions/upload-artifact@v4
        with:
          name: liturgy-widget-apk
          path: liturgy-widget.apk

      # A public download link that works from a phone browser: Releases > Latest build.
      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: "Debug build of commit ${{ github.sha }}. Download liturgy-widget.apk and install it on the phone."
          files: liturgy-widget.apk
          make_latest: true
